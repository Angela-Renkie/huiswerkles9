            De Oldenhove is het symbool van de stad Leeuwarden. In 1529 startte de bouw van de Oldehove.<br>
            De Oldehove heeft een hoogte van ruim 39 meter en heeft een trap met totaal 183 treden.<br>
            Ook is de Oldehove een populaire trouwlocatie.
